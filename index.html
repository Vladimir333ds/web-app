<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Meta -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SEO -->
  <title>Aircraft Tracker Map | Live Flight Tracking</title>

  <meta name="description" content="Track live aircraft around the world using an interactive map. Select coordinates and view real-time aircraft data.">
  <meta name="keywords" content="aircraft tracker, flight tracker, live aircraft, aviation map, flight radar">
  <meta name="author" content="Aircraft Tracker Project">

  <!-- Open Graph -->
  <meta property="og:title" content="Aircraft Tracker Map">
  <meta property="og:description" content="Interactive map to track live aircraft worldwide.">
  <meta property="og:type" content="website">

  <!-- CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/map.css">
  <link rel="stylesheet" href="./styles/theme.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg shadow-sm fixed-top">
    <div class="container-fluid">

      <a class="navbar-brand fw-bold" href="index.html">Aircraft Tracker</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">

        <!-- Navigation Links -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="index.html">Map</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="pages/gallery.html">Pictures</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="pages/blog.html">Blog</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="pages/userprofile.html">My Profile</a>
          </li>
        </ul>

        <!-- Actions -->
        <div class="d-flex gap-2">
          <button id="darkToggle" class="btn btn-dark btn-sm">🌙</button>
          <div id="authArea" class="d-flex gap-2"></div>
        </div>

      </div>
    </div>
  </nav>

  <!-- Map -->
  <div id="map"></div>

  <!-- Tracker Info -->
  <div class="tracker card p-2 shadow-sm">
    <small>Currently trackable aircraft:</small>
    <div id="total" class="fw-bold"></div>
  </div>

  <!-- Controls Panel -->
  <div id="controls" class="controls">

    <button id="togglePanel" class="btn btn-secondary btn-sm toggle-btn">▼</button>

    <div id="controlsContent">
      <div class="container">

        <div class="row g-3 justify-content-center align-items-center">

          <div class="col-6 col-md-auto">
            <label class="form-label">Latitude</label>
            <input type="text" id="lat" class="form-control" readonly>
          </div>

          <div class="col-6 col-md-auto">
            <label class="form-label">Longitude</label>
            <input type="text" id="lon" class="form-control" readonly>
          </div>

          <div class="col-12 col-md-auto">
            <label class="form-label">Range</label>
            <input type="range" min="1" max="500" value="250" id="rng" class="form-range">
            <div id="range_disp" class="text-center small"></div>
          </div>

          <div class="col-6 col-md-auto">
            <button id="search" class="btn btn-primary w-100">Search</button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Login Modal -->
  <div class="modal fade" id="loginModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Login</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <div id="loginError" class="alert alert-danger d-none"></div>
          <div id="loginSuccess" class="alert alert-success d-none"></div>

          <div class="input-group mb-2">
            <span class="input-group-text">
              <i class="bi bi-person"></i>
            </span>
            <input id="loginUsername" class="form-control" placeholder="Username">
          </div>

          <div class="input-group mb-2">
            <span class="input-group-text">
              <i class="bi bi-lock"></i>
            </span>
            <input id="loginPassword" type="password" class="form-control" placeholder="Password">
            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('loginPassword', this)">
              <i class="bi bi-eye"></i>
            </button>
          </div>

        </div>

        <div class="modal-footer">
          <button class="btn btn-primary" onclick="login()">Login</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Signup Modal -->
  <div class="modal fade" id="signupModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Sign Up</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <div id="signupError" class="alert alert-danger d-none" role="alert"></div>

          <div class="input-group mb-2">
            <span class="input-group-text">
              <i class="bi bi-person-plus"></i>
            </span>
            <input id="signupUsername" class="form-control" placeholder="Username">
          </div>

          <div class="input-group mb-2">
            <span class="input-group-text">
              <i class="bi bi-shield-lock"></i>
            </span>
            <input id="signupPassword" type="password" class="form-control" placeholder="Password">
          </div>

        </div>

        <div class="modal-footer">
          <button class="btn btn-success" onclick="signup()">Sign Up</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Aircraft Details Panel -->
  <div id="aircraftDetails" class="details hidden">
    <button class="close" onclick="closeDetails()">✖</button>
    <h3>Aircraft Details</h3>
    <div id="detailsContent"></div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-rotatedmarker/leaflet.rotatedMarker.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Local Scripts -->
  <script src="js/map.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>

</body>

</html>
