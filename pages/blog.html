<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SEO -->
  <title>Aviation Blog | Aircraft Discussions & Posts</title>

  <meta name="description" content="Read and share aviation-related blog posts. Join discussions and comment on aircraft topics.">
  <meta name="keywords" content="aviation blog, aircraft posts, aviation discussion, flight blog">
  <meta name="author" content="Aircraft Tracker Project">

  <!-- Open Graph -->
  <meta property="og:title" content="Aviation Blog">
  <meta property="og:description" content="Community blog for aviation enthusiasts.">
  <meta property="og:type" content="website">

  <!-- CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/blog.css">
  <link rel="stylesheet" href="../styles/theme.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg shadow-sm fixed-top">
    <div class="container-fluid">

      <a class="navbar-brand fw-bold" href="../index.html">Aircraft Tracker</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">

        <!-- Navigation Links -->
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Map</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="gallery.html">Pictures</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="blog.html">Blog</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="userprofile.html">My Profile</a>
          </li>
        </ul>

        <!-- Actions -->
        <div class="d-flex gap-2">
          <button id="darkToggle" class="btn btn-dark btn-sm">🌙</button>
          <div id="authArea" class="d-flex gap-2"></div>
        </div>

      </div>
    </div>
  </nav>

  <!-- Auth Modals -->

  <!-- Login Modal -->
  <div class="modal fade" id="loginModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Login</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <div id="loginError" class="alert alert-danger d-none"></div>

          <div class="input-group mb-2">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input id="loginUsername" class="form-control" placeholder="Username">
          </div>

          <div class="input-group mb-2">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input id="loginPassword" type="password" class="form-control" placeholder="Password">
            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('loginPassword', this)">
              <i class="bi bi-eye"></i>
            </button>
          </div>

        </div>

        <div class="modal-footer">
          <button class="btn btn-primary" onclick="login()">Login</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Signup Modal -->
  <div class="modal fade" id="signupModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Sign Up</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <div id="signupError" class="alert alert-danger d-none"></div>

          <div class="input-group mb-2">
            <span class="input-group-text"><i class="bi bi-person-plus"></i></span>
            <input id="signupUsername" class="form-control" placeholder="Username">
          </div>

          <div class="input-group mb-2">
            <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
            <input id="signupPassword" type="password" class="form-control" placeholder="Password">
          </div>

        </div>

        <div class="modal-footer">
          <button class="btn btn-success" onclick="signup()">Sign Up</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Main Blog Content -->
  <div class="container blog-container">

    <h2 class="text-center mb-4 blog-title">Aviation Blog</h2>

    <!-- Create Post Section -->
    <div id="createPostSection" class="create-post card p-3 mb-4 d-none">
      <h5>Create Post</h5>

      <input id="postTitleInput" class="form-control mb-2" placeholder="Title">

      <textarea id="postContentInput" class="form-control mb-2" rows="3" placeholder="Write something..."></textarea>

      <button class="btn btn-primary" onclick="createPost()">
        <i class="bi bi-send"></i> Post
      </button>
    </div>

    <!-- Blog Feed -->
    <div id="blogFeed" class="blog-feed"></div>
  </div>

  <!-- Post Modal -->
  <div class="modal fade" id="postModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 id="postTitle" class="modal-title"></h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <div id="postMeta" class="mb-2 small"></div>

          <div id="postContent" class="mb-3"></div>

          <div id="postActions" class="mt-3 text-end"></div>

          <img id="postImage" class="img-fluid rounded d-none" />

        </div>

        <!-- Comments Section -->
        <div id="commentsSection" class="mt-4">
          <h6>Comments</h6>

          <div id="commentsList" class="mb-3"></div>

          <textarea id="commentInput" class="form-control mb-2" placeholder="Write a comment..."></textarea>

          <button class="btn btn-sm btn-primary" onclick="addComment()">
            <i class="bi bi-chat-dots"></i> Comment
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-rotatedmarker/leaflet.rotatedMarker.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Local Scripts -->
  <script src="../js/map.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/blog.js"></script>

</body>

</html>
