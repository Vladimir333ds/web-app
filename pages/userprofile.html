<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SEO -->
  <title>User Profile | Aircraft Tracker</title>

  <meta name="description" content="Manage your profile, posts, and comments in the Aircraft Tracker platform.">
  <meta name="keywords" content="user profile, account management, aviation blog profile">
  <meta name="author" content="Aircraft Tracker Project">

  <!-- Open Graph -->
  <meta property="og:title" content="User Profile">
  <meta property="og:description" content="View and manage your account activity.">
  <meta property="og:type" content="website">

  <!-- CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/profile.css">
  <link rel="stylesheet" href="../styles/theme.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg shadow-sm fixed-top">
    <div class="container-fluid">

      <a class="navbar-brand fw-bold" href="../index.html">Aircraft Tracker</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">

        <!-- Navigation Links -->
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Map</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="gallery.html">Pictures</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="blog.html">Blog</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="userprofile.html">My Profile</a>
          </li>
        </ul>

        <!-- Actions -->
        <div class="d-flex gap-2">
          <button id="darkToggle" class="btn btn-dark btn-sm">🌙</button>
          <div id="authArea" class="d-flex gap-2"></div>
        </div>

      </div>
    </div>
  </nav>

  <!-- Auth Modals -->

  <!-- Login Modal -->
  <div class="modal fade" id="loginModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Login</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <div id="loginError" class="alert alert-danger d-none"></div>

          <div class="input-group mb-2">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input id="loginUsername" class="form-control" placeholder="Username">
          </div>

          <div class="input-group mb-2">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input id="loginPassword" type="password" class="form-control" placeholder="Password">
            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('loginPassword', this)">
              <i class="bi bi-eye"></i>
            </button>
          </div>

        </div>

        <div class="modal-footer">
          <button class="btn btn-primary" onclick="login()">Login</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Signup Modal -->
  <div class="modal fade" id="signupModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Sign Up</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <div id="signupError" class="alert alert-danger d-none"></div>

          <div class="input-group mb-2">
            <span class="input-group-text"><i class="bi bi-person-plus"></i></span>
            <input id="signupUsername" class="form-control" placeholder="Username">
          </div>

          <div class="input-group mb-2">
            <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
            <input id="signupPassword" type="password" class="form-control" placeholder="Password">
          </div>

        </div>

        <div class="modal-footer">
          <button class="btn btn-success" onclick="signup()">Sign Up</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Main Layout -->
  <div class="container-fluid">
    <div class="row">

      <!-- Sidebar -->
      <div class="col-md-3 col-lg-2 p-0">
        <div class="profile-sidebar p-3">

          <h5 class="mb-3">My Profile</h5>

          <div class="list-group">

            <button class="list-group-item list-group-item-action active"
              onclick="showSection('profile', this)">
              <i class="bi bi-person"></i> Profile Data
            </button>

            <button class="list-group-item list-group-item-action"
              onclick="showSection('posts', this)">
              <i class="bi bi-file-text"></i> My Posts
            </button>

            <button class="list-group-item list-group-item-action"
              onclick="showSection('comments', this)">
              <i class="bi bi-chat-dots"></i> My Comments
            </button>

          </div>

        </div>
      </div>

      <!-- Content -->
      <div class="col-md-9 col-lg-10 p-4">

        <!-- Profile Section -->
        <div id="section-profile">
          <h3>Profile Data</h3>

          <div class="card p-3">

            <p><strong>Username:</strong> <span id="profileUsername"></span></p>
            <p><strong>Posts:</strong> <span id="profilePosts"></span></p>
            <p><strong>Comments:</strong> <span id="profileComments"></span></p>
            <p><strong>Member since:</strong> <span id="profileCreated"></span></p>

            <hr>

            <div class="d-flex gap-2 flex-wrap">

              <button class="btn btn-warning btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#editUsernameModal">
                <i class="bi bi-pencil"></i> Edit Username
              </button>

              <button class="btn btn-secondary btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#editPasswordModal">
                <i class="bi bi-key"></i> Change Password
              </button>

              <button class="btn btn-danger btn-sm" onclick="deleteAccount()">
                <i class="bi bi-trash"></i> Delete Account
              </button>

            </div>

          </div>
        </div>

        <!-- Posts Section -->
        <div id="section-posts" class="d-none">
          <h3>My Posts</h3>
          <div id="myPosts"></div>
        </div>

        <!-- Comments Section -->
        <div id="section-comments" class="d-none">
          <h3>My Comments</h3>
          <div id="myComments" class="comments-wrapper"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Post View Modal -->
  <div class="modal fade" id="viewPostModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 id="modalPostTitle" class="modal-title"></h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <div id="modalPostMeta" class="mb-2 small"></div>
          <div id="modalPostContent" class="mb-3"></div>

          <hr>

          <h6>Your Comment</h6>
          <div id="modalUserComment" class="p-2 rounded bg-light comment"></div>

        </div>

      </div>
    </div>
  </div>

  <!-- My Post Modal -->
  <div class="modal fade" id="myPostModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 id="myPostTitle" class="modal-title"></h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <div id="myPostContent" class="mb-3"></div>
          <div class="text-end" id="myPostActions"></div>

          <div id="editPostSection" class="d-none mt-3">
            <input id="editTitle" class="form-control mb-2">
            <textarea id="editContent" class="form-control mb-2"></textarea>

            <button class="btn btn-success btn-sm" onclick="saveEdit()">
              Save
            </button>
          </div>

        </div>

      </div>
    </div>
  </div>

  <!-- Edit Username Modal -->
  <div class="modal fade" id="editUsernameModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Edit Username</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <div id="editUsernameError" class="alert alert-danger d-none"></div>

          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input id="newUsernameInput" class="form-control" placeholder="New username">
          </div>

        </div>

        <div class="modal-footer">
          <button class="btn btn-warning" onclick="submitUsernameChange()">
            Save Changes
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Edit Password Modal -->
  <div class="modal fade" id="editPasswordModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Change Password</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <div id="editPasswordError" class="alert alert-danger d-none"></div>

          <div class="input-group mb-2">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input id="currentPasswordInput" type="password" class="form-control" placeholder="Current password">
          </div>

          <div class="input-group mb-2">
            <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
            <input id="newPasswordInput" type="password" class="form-control" placeholder="New password">
          </div>

        </div>

        <div class="modal-footer">
          <button class="btn btn-warning" onclick="submitPasswordChange()">
            Save Changes
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-rotatedmarker/leaflet.rotatedMarker.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Local Scripts -->
  <script src="../js/map.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/userprofile.js"></script>

</body>

</html>
