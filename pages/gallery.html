<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SEO -->
  <title>Aircraft Gallery | Aviation Images Collection</title>

  <meta name="description" content="Browse a curated gallery of aircraft including commercial, military, and private jets.">
  <meta name="keywords" content="aircraft gallery, aviation photos, planes, military aircraft, private jets">
  <meta name="author" content="Aircraft Tracker Project">

  <!-- Open Graph -->
  <meta property="og:title" content="Aircraft Gallery">
  <meta property="og:description" content="Explore aircraft images across multiple categories.">
  <meta property="og:type" content="website">

  <!-- CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/gallery.css">
  <link rel="stylesheet" href="../styles/theme.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg shadow-sm fixed-top">
  <div class="container-fluid">

    <a class="navbar-brand fw-bold" href="../index.html">Aircraft Tracker</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">

      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="../index.html">Map</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="#">Pictures</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="blog.html">Blog</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="userprofile.html">My Profile</a>
        </li>
      </ul>

      <div class="d-flex gap-2">
        <button id="darkToggle" class="btn btn-dark btn-sm">🌙</button>
        <div id="authArea" class="d-flex gap-2"></div>
      </div>

    </div>
  </div>
</nav>

<!-- ================= GALLERY CONTENT ================= -->
<div class="container gallery-container">

  <h2 class="text-center mb-4 gallery-title">Aircraft Gallery</h2>

  <!-- CATEGORY FILTERS -->
  <div class="text-center mb-4 filter-btns">
    <button class="btn btn-outline-primary m-1" data-category="All" onclick="filterAircraft('All')">All</button>
    <button class="btn btn-outline-primary m-1" data-category="Commercial" onclick="filterAircraft('Commercial')">Commercial</button>
    <button class="btn btn-outline-primary m-1" data-category="Military" onclick="filterAircraft('Military')">Military</button>
    <button class="btn btn-outline-primary m-1" data-category="Private Jet" onclick="filterAircraft('Private Jet')">Private Jet</button>
    <button class="btn btn-outline-primary m-1" data-category="General Aviation" onclick="filterAircraft('General Aviation')">General Aviation</button>
  </div>

  <!-- SEARCH -->
  <div class="text-center mb-4">
    <div class="search-wrapper mx-auto mb-4">
      <input 
        type="text" 
        id="searchInput" 
        class="form-control search-bar" 
        placeholder="Search aircraft...">
      <span class="clear-btn" onclick="clearSearch()">✖</span>
    </div>

    <!-- GALLERY GRID -->
    <div id="gallery" class="row g-4"></div>
  </div>

</div>

<!-- ================= IMAGE MODAL ================= -->
<div class="modal fade" id="imageModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-body position-relative text-center">

        <button class="btn-close modal-close-btn" data-bs-dismiss="modal"></button>

        <button class="nav-arrow left" onclick="prevImage()">
          <i class="bi bi-chevron-left"></i>
        </button>

        <img id="modalImage" class="img-fluid rounded modal-img" />

        <button class="nav-arrow right" onclick="nextImage()">
          <i class="bi bi-chevron-right"></i>
        </button>

        <div id="modalCaption" class="fw-semibold mt-3"></div>

      </div>

    </div>
  </div>
</div>

<!-- ================= AUTH MODALS ================= -->

<!-- LOGIN -->
<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Login</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div id="loginError" class="alert alert-danger d-none"></div>
        <div id="loginSuccess" class="alert alert-success d-none"></div>

        <div class="input-group mb-2">
          <span class="input-group-text">
            <i class="bi bi-person"></i>
          </span>
          <input id="loginUsername" class="form-control" placeholder="Username">
        </div>

        <div class="input-group mb-2">
          <span class="input-group-text">
            <i class="bi bi-lock"></i>
          </span>
          <input id="loginPassword" type="password" class="form-control" placeholder="Password">
          <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('loginPassword', this)">
            <i class="bi bi-eye"></i>
          </button>
        </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-primary" onclick="login()">Login</button>
      </div>

    </div>
  </div>
</div>

<!-- SIGNUP -->
<div class="modal fade" id="signupModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Sign Up</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div id="signupError" class="alert alert-danger d-none" role="alert"></div>

        <div class="input-group mb-2">
          <span class="input-group-text">
            <i class="bi bi-person-plus"></i>
          </span>
          <input id="signupUsername" class="form-control" placeholder="Username">
        </div>

        <div class="input-group mb-2">
          <span class="input-group-text">
            <i class="bi bi-shield-lock"></i>
          </span>
          <input id="signupPassword" type="password" class="form-control" placeholder="Password">
        </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-success" onclick="signup()">Sign Up</button>
      </div>

    </div>
  </div>
</div>

<!-- ================= SCRIPTS ================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/gallery.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/auth.js"></script>

</body>
</html>
